on: [push, pull_request]
name: Miri tests
jobs:
  miri:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings -C debug_assertions"
      MIRIFLAGS: "-Zmiri-num-cpus=4"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run miri tests (no default features)
        run: cargo miri test --all --no-default-features
      - name: Run miri tests (all features)
        run: cargo miri test --all --all-features
