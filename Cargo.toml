[package]
name = "appendvec"
description = "A concurrent append-only container of immutable values"
version = "0.1.5"
authors = ["Guillaume Endignoux <ggendx@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gendx/appendvec"
categories = ["concurrency", "algorithms", "data-structures"]
keywords = ["concurrent", "append-only", "immutable", "container", "collection"]
exclude = [".github/*"]
edition = "2024"
rust-version = "1.85.0"

[package.metadata.docs.rs]
features = ["get-size2"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = []
get-size2 = ["dep:get-size2"]

[dependencies]
crossbeam-utils = "0.8.21"
get-size2 = { optional = true, version = "0.11.0", default-features = false, features = ["derive"] }
